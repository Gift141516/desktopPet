<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + Vue 3 App</title>
<!--      <script src="https://unpkg.com/pixi.js@7.4.2/dist/pixi.min.js"></script>-->
      <script src="/live2d/pixi.js"></script>
      <script src="/live2d/live2d.min.js"></script>
      <script src="/live2d/live2dcubismcore.min.js"></script>
      <script>
          window.PIXI = window.PIXI || PIXI;
          window.PIXI.utils = PIXI.utils || {};
      </script>
      <script src="/live2d/pixi-live2d-display.js"></script>

      <script>
          // 核心补丁：如果插件挂载到了错误的地方，手动把它拉回来
          if (!window.PIXI.live2d && window.PIXI_LIVE2D_DISPLAY) {
              window.PIXI.live2d = window.PIXI_LIVE2D_DISPLAY;
          }
      </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
